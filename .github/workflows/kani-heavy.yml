name: Kani heavy proofs

# The 7 Kani harnesses that do not finish within 600 s (timeout or OOM on a
# hosted runner, 2026-10-06), each alone with a 60 min budget. They run weekly
# and on demand instead of on every push: about 7 runner-hours per run on a
# private repository. They count as verified only when their shard is green;
# CLAUDE.md lists them. Shard assignment: oasis-rt/kani_shards.sh (checked by
# the kani-shard-coverage job in ci.yml).

on:
  schedule:
    - cron: "17 3 * * 1"   # Mondays 03:17 UTC
  workflow_dispatch:

jobs:
  kani-heavy:
    name: Kani proofs (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: heavy-proof_ae_snapshot_internal_consistency, harness_timeout: 3600s, minutes: 75 }
          - { shard: heavy-proof_ae_capacity_consumed_monotonic, harness_timeout: 3600s, minutes: 75 }
          - { shard: heavy-proof_ag_reset_count_extrapolation, harness_timeout: 3600s, minutes: 75 }
          - { shard: heavy-proof_ah_arithmetic_tolerance_symmetric, harness_timeout: 3600s, minutes: 75 }
          - { shard: heavy-proof_m4_fitness_monotone_in_goal, harness_timeout: 3600s, minutes: 75 }
          - { shard: heavy-proof_m3_pain_monotone_in_magnitude, harness_timeout: 3600s, minutes: 75 }
          - { shard: heavy-proof_topic_hash_deterministic_1byte, harness_timeout: 3600s, minutes: 75 }
    defaults:
      run:
        working-directory: oasis-rt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Install Kani
        run: |
          cargo install --locked kani-verifier
          cargo kani setup
      # -Z stubbing: proof_frag_reassembler_never_panics replaces SHA-256 with an
      # arbitrary digest (#[kani::stub]); without the flag that harness fails.
      - name: cargo kani --lib (shard)
        run: |
          H=""
          for h in $(./kani_shards.sh "${{ matrix.shard }}"); do H="$H --harness $h"; done
          [ -n "$H" ] || { echo "::error::shard ${{ matrix.shard }} has no harness"; exit 1; }
          cargo kani --lib $H --exact -Z unstable-options -Z stubbing --harness-timeout ${{ matrix.harness_timeout }} -j 1 --output-format terse

