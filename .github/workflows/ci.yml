name: OASIS-RT CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-tests:
    name: Rust tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable]
        include:
          - os: ubuntu-latest
            toolchain: beta
    defaults:
      run:
        working-directory: oasis-rt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .   # Cargo.lock + target/ now live at the workspace root
      - name: cargo fmt --check
        run: cargo fmt --check
        continue-on-error: ${{ matrix.toolchain == 'beta' }}
      - name: cargo clippy (warnings allowed for now, tracked for cleanup)
        run: cargo clippy --release --bins --lib
      - name: cargo build --release
        run: cargo build --release --bins --lib
      - name: cargo test --release --lib
        run: cargo test --release --lib
      - name: Smoke test drone_bridge (Linux/macOS)
        if: runner.os != 'Windows'
        env:
          OASIS_SHARED: /tmp/oasis_shared/
        run: |
          mkdir -p /tmp/oasis_shared
          printf '{"tick":1,"x":0,"y":0,"alt":0.5,"roll":0,"pitch":0,"gz":0,"rf":2,"rl":2,"rr":2,"rb":2,"vx":0,"vy":0}\n' \
            | ../target/release/drone_bridge patrol1 0 2>&1 | head -5   # workspace target/ is at repo root

  security-audit:
    name: cargo-audit (RustSec)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # audit-check publishes its result as a check run; on push to main the
    # default read-only token was refused ("Resource not accessible by
    # integration") even though no vulnerability was found.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  kani-proofs:
    name: Kani proofs (${{ matrix.shard }})
    runs-on: ubuntu-latest
    # Authoritative formal-verification run for all #[kani::proof] harnesses.
    # oasis-rt/kani_shards.sh assigns each harness to exactly one shard (checked
    # by kani-shard-coverage). Harnesses that do not fit the 600 s budget run
    # alone in a heavy-* shard with 60 min; they count as verified only when
    # their shard is green. History: -j 2 on the whole suite was killed (exit
    # 143), -j 1 hit the 90-min job timeout.
    timeout-minutes: ${{ matrix.minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: mesh-ac-af, harness_timeout: 600s, minutes: 120 }
          - { shard: mesh-ag-aj, harness_timeout: 600s, minutes: 120 }
          - { shard: mesh-core-v0b, harness_timeout: 600s, minutes: 120 }
          - { shard: spinal-synapse, harness_timeout: 600s, minutes: 120 }
          - { shard: authority, harness_timeout: 600s, minutes: 120 }
          - { shard: other-modules, harness_timeout: 600s, minutes: 120 }
          - { shard: heavy-proof_ae_snapshot_internal_consistency, harness_timeout: 3600s, minutes: 75 }
          - { shard: heavy-proof_ae_capacity_consumed_monotonic, harness_timeout: 3600s, minutes: 75 }
          - { shard: heavy-proof_ag_reset_count_extrapolation, harness_timeout: 3600s, minutes: 75 }
          - { shard: heavy-proof_ah_arithmetic_tolerance_symmetric, harness_timeout: 3600s, minutes: 75 }
          - { shard: heavy-proof_m4_fitness_monotone_in_goal, harness_timeout: 3600s, minutes: 75 }
          - { shard: heavy-proof_m3_pain_monotone_in_magnitude, harness_timeout: 3600s, minutes: 75 }
          - { shard: heavy-proof_topic_hash_deterministic_1byte, harness_timeout: 3600s, minutes: 75 }
    defaults:
      run:
        working-directory: oasis-rt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Install Kani
        run: |
          cargo install --locked kani-verifier
          cargo kani setup
      - name: cargo kani --lib (shard)
        run: |
          H=""
          for h in $(./kani_shards.sh "${{ matrix.shard }}"); do H="$H --harness $h"; done
          [ -n "$H" ] || { echo "::error::shard ${{ matrix.shard }} has no harness"; exit 1; }
          cargo kani --lib $H --exact -Z unstable-options --harness-timeout ${{ matrix.harness_timeout }} -j 1 --output-format terse

  kani-shard-coverage:
    name: Kani shard coverage (every harness in exactly one shard)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: oasis-rt
    steps:
      - uses: actions/checkout@v4
      - name: Every harness maps to one shard, and every shard is in the CI matrix
        run: |
          ./kani_shards.sh --check
          for s in $(./kani_shards.sh --all | awk '{print $1}' | sort -u); do
            grep -q "shard: $s," ../.github/workflows/ci.yml || { echo "::error::shard $s is not in the CI matrix"; exit 1; }
          done

  docker-build:
    name: Docker image build + healthcheck
    runs-on: ubuntu-latest
    needs: rust-tests
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build OASIS-RT image
        run: docker build -f oasis-rt/Dockerfile -t oasis-rt:ci .
      - name: Run image smoke test
        run: |
          output=$(docker run --rm oasis-rt:ci 2>&1)
          echo "$output" | head -30
          echo "$output" | grep -q 'TAKEOFF\|OASIS DRONE BRIDGE' \
            || (echo 'Smoke test failed: no expected output'; exit 1)
