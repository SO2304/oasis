name: OASIS-RT CI

on:
  push:
    # Every branch, not just main. A work branch got no run at all unless someone
    # remembered the manual button, so the gate that matters most — the one on the
    # branch being written — was the one that never ran (noticed 2026-10-09).
    branches: ['**']
  pull_request:
  # Manual trigger. Two reasons: a branch that is neither main nor a PR gets no run
  # otherwise, and if this button is absent from the Actions tab then Actions is
  # disabled for the repository — which is the first thing to check when no run appears.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-tests:
    name: Rust tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable]
        include:
          - os: ubuntu-latest
            toolchain: beta
    defaults:
      run:
        working-directory: oasis-rt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .   # Cargo.lock + target/ now live at the workspace root
      - name: cargo fmt --check
        run: cargo fmt --check
        continue-on-error: ${{ matrix.toolchain == 'beta' }}
      - name: cargo clippy (warnings allowed for now, tracked for cleanup)
        run: cargo clippy --release --bins --lib
      - name: cargo build --release
        run: cargo build --release --bins --lib
      - name: cargo test --release --workspace
        # NOT `--lib`: that ran the library's own tests and nothing else, so the
        # integration tests under oasis-rt/tests/ — the ones that drive real sockets
        # against an rmodbus device, including the concurrency regression test — never ran
        # in CI at all (noticed 2026-10-09).
        run: cargo test --release --workspace
      - name: cargo test (oasis-lora-transport, outside the workspace)
        # This crate is deliberately not a workspace member: it unconditionally enables
        # oasis-rt/mesh_bloom_mcu, which inside the workspace would shrink the host Bloom
        # filter for every crate. The consequence was that `--workspace` never reached it
        # and its 31 tests ran nowhere — including the ones that pin the radio budget
        # figures six documents quote.
        working-directory: oasis-lora-transport
        run: cargo test --release
      - name: Smoke test drone_bridge (Linux/macOS)
        if: runner.os != 'Windows'
        env:
          OASIS_SHARED: /tmp/oasis_shared/
        run: |
          mkdir -p /tmp/oasis_shared
          printf '{"tick":1,"x":0,"y":0,"alt":0.5,"roll":0,"pitch":0,"gz":0,"rf":2,"rl":2,"rr":2,"rb":2,"vx":0,"vy":0}\n' \
            | ../target/release/drone_bridge patrol1 0 2>&1 | head -5   # workspace target/ is at repo root

  security-audit:
    name: cargo-audit (RustSec)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # audit-check publishes its result as a check run; on push to main the
    # default read-only token was refused ("Resource not accessible by
    # integration") even though no vulnerability was found.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  kani-proofs:
    name: Kani proofs (${{ matrix.shard }})
    runs-on: ubuntu-latest
    # Authoritative formal-verification run for all #[kani::proof] harnesses.
    # oasis-rt/kani_shards.sh assigns each harness to exactly one shard (checked
    # by kani-shard-coverage). Harnesses that do not fit the 600 s budget run
    # alone in a heavy-* shard with 60 min, in kani-heavy.yml (weekly and on
    # demand, not on every push: about 7 runner-hours each time); they count as
    # verified only when their shard is green. History: -j 2 on the whole suite was killed (exit
    # 143), -j 1 hit the 90-min job timeout.
    timeout-minutes: ${{ matrix.minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: mesh-ac-af, harness_timeout: 600s, minutes: 120 }
          - { shard: mesh-ag-aj, harness_timeout: 600s, minutes: 120 }
          - { shard: mesh-core-v0b, harness_timeout: 600s, minutes: 120 }
          - { shard: spinal-synapse, harness_timeout: 600s, minutes: 120 }
          - { shard: authority, harness_timeout: 600s, minutes: 120 }
          - { shard: authority-phase1, harness_timeout: 600s, minutes: 120 }
          - { shard: other-modules, harness_timeout: 600s, minutes: 120 }
    defaults:
      run:
        working-directory: oasis-rt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Install Kani
        run: |
          cargo install --locked kani-verifier
          cargo kani setup
      # -Z stubbing: proof_frag_reassembler_never_panics replaces SHA-256 with an
      # arbitrary digest (#[kani::stub]); without the flag that harness fails.
      - name: cargo kani --lib (shard)
        run: |
          H=""
          for h in $(./kani_shards.sh "${{ matrix.shard }}"); do H="$H --harness $h"; done
          [ -n "$H" ] || { echo "::error::shard ${{ matrix.shard }} has no harness"; exit 1; }
          cargo kani --lib $H --exact -Z unstable-options -Z stubbing --harness-timeout ${{ matrix.harness_timeout }} -j 1 --output-format terse

  kani-shard-coverage:
    name: Kani shard coverage (every harness in exactly one shard)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: oasis-rt
    steps:
      - uses: actions/checkout@v4
      - name: Every harness maps to one shard, and every shard is in a CI matrix
        run: |
          ./kani_shards.sh --check
          for s in $(./kani_shards.sh --all | awk '{print $1}' | sort -u); do
            case "$s" in heavy-*) f=../.github/workflows/kani-heavy.yml ;; *) f=../.github/workflows/ci.yml ;; esac
            grep -q "shard: $s," "$f" || { echo "::error::shard $s is not in the matrix of $f"; exit 1; }
          done

  pilot-campaign:
    name: Pilot end-to-end against the test device (shipped binaries, 3 processes)
    runs-on: ubuntu-latest
    needs: rust-tests
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # The campaign runs the BINARIES, not the library, so it catches what a `cargo test`
      # cannot: config and seed files read from disk, a restart of each process, the
      # persisted sequence and send counter, and the journal on disk. It found three
      # defects the day it was written, each invisible from an in-process test, which is
      # why it belongs in CI rather than in a one-off log.
      - name: Build the binaries and the device
        run: cargo build --release -p oasis-rt -p oasis-test-plc
      # No case count in this name: it said 23 while the campaign was at 69, and a number
      # in a step title is a number nothing checks. The script prints its own count and
      # fails on any case; `tools/check_claims.sh` compares the count to the archived log.
      - name: Run the campaign (the device's own write counter is the ground truth)
        run: bash tools/pilot_campaign.sh "$RUNNER_TEMP/campaign"
      - name: Keep the logs whatever happened
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pilot-campaign
          path: |
            ${{ runner.temp }}/campaign/*.log
            ${{ runner.temp }}/campaign/jrn*.txt
          if-no-files-found: warn

  claims:
    name: Documented counts match the tree (tools/check_claims.sh --full)
    runs-on: ubuntu-latest
    needs: rust-tests
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      # The drift checker re-derives every count in CLAUDE.md, README.md and SECURITY.md
      # from the tree, verifies each evidence manifest against the committed blobs, checks
      # that every file under evidence/ is covered by one, runs the MCU build command
      # printed in CLAUDE.md, and refuses a broken relative link or a markdown table row
      # whose width does not match its header. It ran only on a developer's machine until
      # 2026-10-09, which is the one place a tired developer skips it.
      # Two targets: the build command printed in CLAUDE.md is thumbv7em (the matrix's
      # "MCU cross-compile" row), while the firmware size table is measured on thumbv6m
      # ELFs. The checker uses both, so both must be installed or it reports a failure that
      # is the runner's, not the tree's.
      - name: Install the MCU targets the checker uses
        run: rustup target add thumbv7em-none-eabi thumbv6m-none-eabi
      - name: bash tools/check_claims.sh --full
        run: bash tools/check_claims.sh --full

  docker-build:
    name: Docker image build + healthcheck
    runs-on: ubuntu-latest
    needs: rust-tests
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build OASIS-RT image
        run: docker build -f oasis-rt/Dockerfile -t oasis-rt:ci .
      - name: Run image smoke test
        run: |
          output=$(docker run --rm oasis-rt:ci 2>&1)
          echo "$output" | head -30
          echo "$output" | grep -q 'TAKEOFF\|OASIS DRONE BRIDGE' \
            || (echo 'Smoke test failed: no expected output'; exit 1)
