name: OASIS-RT CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-tests:
    name: Rust tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable]
        include:
          - os: ubuntu-latest
            toolchain: beta
    defaults:
      run:
        working-directory: oasis-rt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .   # Cargo.lock + target/ now live at the workspace root
      - name: cargo fmt --check
        run: cargo fmt --check
        continue-on-error: ${{ matrix.toolchain == 'beta' }}
      - name: cargo clippy (warnings allowed for now, tracked for cleanup)
        run: cargo clippy --release --bins --lib
      - name: cargo build --release
        run: cargo build --release --bins --lib
      - name: cargo test --release --lib
        run: cargo test --release --lib
      - name: Smoke test drone_bridge (Linux/macOS)
        if: runner.os != 'Windows'
        env:
          OASIS_SHARED: /tmp/oasis_shared/
        run: |
          mkdir -p /tmp/oasis_shared
          printf '{"tick":1,"x":0,"y":0,"alt":0.5,"roll":0,"pitch":0,"gz":0,"rf":2,"rl":2,"rr":2,"rb":2,"vx":0,"vy":0}\n' \
            | ../target/release/drone_bridge patrol1 0 2>&1 | head -5   # workspace target/ is at repo root

  security-audit:
    name: cargo-audit (RustSec)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  kani-proofs:
    name: Kani proofs (${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    # Authoritative formal-verification run for all #[kani::proof] harnesses.
    # CBMC is RAM-heavy: a 3.3 GB WSL2 VM could NOT finish the full suite.
    # On hosted runners, -j 2 was killed (exit 143, ~14 min) and -j 1 on the
    # whole suite hit the 90-min job timeout. So the suite is sharded by module;
    # `--harness` matches any harness whose full path contains the filter.
    # Every harness must match a shard (checked by the coverage step below).
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: mesh-ac-af
            filters: "mesh::kani_proofs::proof_ac_ mesh::kani_proofs::proof_ad_ mesh::kani_proofs::proof_ae_ mesh::kani_proofs::proof_af_"
          - name: mesh-ag-aj
            filters: "mesh::kani_proofs::proof_ag_ mesh::kani_proofs::proof_ah_ mesh::kani_proofs::proof_ai_ mesh::kani_proofs::proof_aj_"
          - name: mesh-core-v0b
            filters: "mesh::kani_proofs::proof_mesh_ mesh::kani_proofs::proof_v0b_"
          - name: spinal-synapse
            filters: "spinal::kani_proofs:: synapse::kani_proofs::"
          - name: authority
            filters: "tx_lease::kani_proofs:: mesh_revocation::kani_proofs:: actuation::kani_proofs:: hal::kani_proofs:: hyper_state::kani_proofs::"
          - name: other-modules
            filters: "services::kani_proofs:: actions::kani_proofs:: world_model::kani_proofs:: topics::kani_proofs:: tension::kani_proofs:: reflex::kani_proofs:: emotion::kani_proofs:: efference::kani_proofs:: morpho::kani_proofs:: federation::kani_proofs:: dreams::kani_proofs:: branching::kani_proofs:: timers::kani_proofs:: transforms::kani_proofs:: parameters::kani_proofs::"
    defaults:
      run:
        working-directory: oasis-rt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Install Kani
        run: |
          cargo install --locked kani-verifier
          cargo kani setup
      - name: cargo kani --lib (shard)
        run: |
          H=""
          for f in ${{ matrix.shard.filters }}; do H="$H --harness $f"; done
          cargo kani --lib $H -Z unstable-options --harness-timeout 600s -j 1 --output-format terse

  kani-shard-coverage:
    name: Kani shard coverage (every harness in a shard)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check every kani::proof module is listed in a shard
        run: |
          missing=0
          for f in $(grep -rl 'kani::proof' oasis-rt/src); do
            m=$(echo "$f" | sed -E 's#oasis-rt/src/##; s#/kani_proofs\.rs$##; s#\.rs$##; s#/#::#g')
            grep -qE "[ \"]$m::kani_proofs::" .github/workflows/ci.yml || { echo "::error::$f ($m) is in no Kani shard"; missing=1; }
          done
          for p in $(grep -A3 'kani::proof' oasis-rt/src/mesh/kani_proofs.rs | grep -oE 'fn proof_[a-z0-9]+_' | sed 's/fn //' | sort -u); do
            grep -q "mesh::kani_proofs::$p" .github/workflows/ci.yml || { echo "::error::mesh harness prefix $p is in no shard"; missing=1; }
          done
          exit $missing

  docker-build:
    name: Docker image build + healthcheck
    runs-on: ubuntu-latest
    needs: rust-tests
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build OASIS-RT image
        run: docker build -f oasis-rt/Dockerfile -t oasis-rt:ci .
      - name: Run image smoke test
        run: |
          output=$(docker run --rm oasis-rt:ci 2>&1)
          echo "$output" | head -30
          echo "$output" | grep -q 'TAKEOFF\|OASIS DRONE BRIDGE' \
            || (echo 'Smoke test failed: no expected output'; exit 1)
