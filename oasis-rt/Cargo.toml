[package]
name = "oasis-rt"
version = "0.3.0"
edition = "2021"
license = "MIT"  # matches the repository LICENSE file

[lib]
name = "oasis_rt"
path = "src/lib.rs"

[dependencies]
# oasis-operator-key: the k-of-n operator quorum verifier.
#
# This was a DEV-dependency until 2026-10-09, because `oasis-operator-key` declared a
# dependency back on `oasis-rt` and the resulting cycle is only tolerated inside a
# workspace. That had a real cost: a `[[bin]]` cannot use a dev-dependency, so
# `oasis_mbtcp_gateway` could not verify a multi-signed revocation list and refused every
# one of them by name. The cycle turned out to be an artefact -- that crate's `src/`
# mentions `oasis_rt` nowhere, only its tests and examples do -- so it moved to ITS
# dev-dependencies and this is now an ordinary dependency.
#
# Optional, behind `std`: the crate is `no_std` and cross-compiles alone, but a k-of-n list
# is only ever checked on a host, so the MCU graph does not grow for it.
oasis-operator-key = { path = "../oasis-operator-key", version = "0.1.0", optional = true }
ed25519-compact = { version = "2.2.0", default-features = false, features = ["x25519"] }
# serde: no_std + alloc. `derive` is used only by main.rs (std binary).
# Library modules use serde_json::Value; both crates ship with `alloc` feature
# that makes them work without the OS. Changed 2026-04-22 during MCU port.
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
sha2 = { version = "0.11.0", default-features = false }
# RustCrypto AEAD, audited. ChaCha20-Poly1305 per RFC 8439.
# Chosen over AES-GCM for: constant-time on all targets (no AES-NI dep),
# smaller attack surface, same security level (128-bit tag).
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
# OS-provided CSPRNG (getrandom(2) on Linux, BCryptGenRandom on Windows, getentropy on macOS).
# Required for proper random nonce generation in AEAD. Without this, nonce collision
# risk is elevated by weak entropy sources. Optional to allow MCU builds to supply
# their own RNG via the `random_nonce` injection point (not yet exposed).
getrandom = { version = "0.2", optional = true }
# libm: provides f64 trig (sin, cos, atan2), sqrt, exp, ln, powi for no_std.
# core has `f64` but not its method impls — those live in std. libm fills
# the gap. ~10 KB code, well-audited, no further deps.
libm = "0.2"
# ML-DSA-44 (FIPS 204 final) for hybrid authority signatures (docs/specs/PQ_AUTHORITY_SPEC.md).
# libcrux-ml-dsa (Cryspen), pure Rust, no_std without alloc: arithmetic, NTT and
# serialization formally verified (hax/F*). Chosen by the RP2040 bake-off over RustCrypto
# ml-dsa: 44.8 KB vs 84.0 KB peak stack, +11 % time, +101 KB flash
# (evidence/silicon/2026-10-06/pq/REPORT.md). Latest stable release, pinned exactly;
# verification only on devices. Pre-1.0.
libcrux-ml-dsa = { version = "=0.0.10", default-features = false, features = ["mldsa44"] }
# CRC-16/MODBUS for the Modbus RTU gateway (docs/specs/MODBUS_GATEWAY_SPEC.md). mrhooray/crc-rs,
# no_std, catalogue algorithms, ~300 M downloads. Line-error detection only, not security.
crc = { version = "=3.4.0", default-features = false }
# Relay pre-filter (docs/specs/RELAY_PREFILTER_SPEC.md): HMAC-SHA256 network tag (RFC 2104)
# and HKDF-SHA256 (RFC 5869) for the per-node network-key envelope. RustCrypto, same
# digest 0.11 generation as sha2 0.11, no_std.
hmac = { version = "=0.13.0", default-features = false }
hkdf = { version = "=0.13.0", default-features = false }

[dev-dependencies]
# RustCrypto ml-dsa: independent ML-DSA-44 oracle (NOT independently audited, per its
# README). Every test signature is checked by both implementations, plus NIST ACVP.
ml-dsa = { version = "=0.1.1", default-features = false }
# Serializes tests that mutate process-wide env vars (OASIS_SIGNING_KEY, OASIS_ED25519_SEED).
# Without this, parallel test execution causes intermittent failures in federation suite.
serial_test = "3"
# rmodbus: independent Modbus RTU server used as the device in the gateway tests (it must
# parse and apply every frame the gateway builds). Also the device firmware on silicon.
rmodbus = "=0.12.2"

[features]
default = ["std", "std_env", "os_random", "mesh_v10"]
# mesh_v10: activates SPORE\x0A Ed25519 per-node mesh signing. Uses only
# the baseline Ed25519 API of ed25519-compact (KeyPair::from_seed,
# PublicKey::verify, etc.) which is always available regardless of cargo
# features. We intentionally do NOT pull `ed25519-compact/ed25519` (which
# adds RustCrypto trait impls via the `signature` crate v2.2; that crate
# is not no_std-clean and would break MCU builds). This makes mesh_v10
# safely compilable on thumbv6m-none-eabi alongside no_std.
mesh_v10 = []
# std: enables the standard library. When disabled, oasis-rt becomes
# a no_std crate using `alloc` for heap types (Vec, String, Box).
# MCU targets: `cargo build --no-default-features --release`
std = ["dep:oasis-operator-key"]
# std_env: enables env-var based config helpers (PainConfig::from_env).
# Disable for no_std/MCU builds: `cargo build --no-default-features --release`
std_env = []
# os_random: pulls in `getrandom` for AEAD nonce generation. When disabled,
# `spore_crypto::encrypt_envelope` is NOT available. MCU targets must disable
# this and provide their own nonce construction via a future user-injectable
# RNG hook (not yet exposed). Added 2026-04-22 during MCU port.
os_random = ["dep:getrandom", "ed25519-compact/random", "ed25519-compact/std"]
# mesh_bloom_mcu: shrinks the mesh dedup Bloom filter from 64 KiB (default)
# to 2 KiB per router. Cost: 1% FPR threshold drops from ~52 k to ~1.6 k
# inserts, so operators on small-RAM targets must reset much more often.
# Use on Cortex-M-class MCUs where 64 KiB is impractical.
# `cargo build --features mesh_bloom_mcu --release`
mesh_bloom_mcu = []

# Build profiles live at the workspace root (../Cargo.toml). Cargo ignores
# [profile.*] declared in a non-root member crate.

