[package]
name = "oasis-bootloader"
version = "0.1.0"
edition = "2021"
description = "A/B bootloader for the RP2040 OASIS test nodes (Phase 1.3): embassy-boot-rp, unmodified logic. NOT part of the host workspace."
publish = false

# embassy-boot (power-fail-safe swap, trial boot + automatic revert, watchdog) is
# used as is: docs/specs/FIRMWARE_UPDATE_SPEC.md §1. Its own signature check is not
# enabled; the install gate lives in the running application (OAU1 manifest).
[dependencies]
embassy-boot-rp = "=0.10.0"
embassy-rp = { version = "=0.10.0", default-features = false, features = ["rt", "rp2040"] }
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
cortex-m = { version = "0.7.6", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7"
embedded-storage = "0.3.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
debug = false
panic = "abort"

[profile.dev]
opt-level = "s"
panic = "abort"
