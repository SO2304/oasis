# cargo-deny policy (Phase 2.4, prompts/OASIS_VS_VERIDIFY.md). Run: `cargo deny check`
# at the root (workspace) and in each excluded firmware crate (see evidence/supply-chain/).
[graph]
all-features = false

[advisories]
version = 2
# Every exception carries its ID and a reason, and is reported in
# evidence/supply-chain/2026-10-07/REPORT.md.
ignore = [
    # proc-macro-error2 2.0.1 is unmaintained (no known vulnerability). It is a build-time
    # proc-macro dependency only: libcrux-ml-dsa -> libcrux-intrinsics -> core-models ->
    # hax-lib -> hax-lib-macros. It runs on the build host and is not linked into any binary.
    # Remove when libcrux drops it.
    { id = "RUSTSEC-2026-0173", reason = "unmaintained build-time proc-macro via libcrux-ml-dsa (hax-lib-macros); no vulnerability" },
    # Firmware crates only (oasis-silicon-test, oasis-bootloader, oasis-mcu-demo,
    # oasis-renode-m11). bare-metal 0.2.5 is deprecated (no vulnerability); it is a
    # runtime dependency of cortex-m 0.7.9, the Cortex-M foundation crate under rp2040-hal.
    { id = "RUSTSEC-2026-0110", reason = "deprecated bare-metal 0.2.5 via cortex-m 0.7.9; no vulnerability; no replacement without leaving cortex-m 0.7" },
    # paste 1.0.15 is unmaintained (no vulnerability); build-time proc-macro via the PIO
    # crates of rp2040-hal 0.10 and embassy-rp 0.10.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained build-time proc-macro paste via rp2040-hal/embassy-rp PIO crates; no vulnerability" },
]

[licenses]
version = 2
# Permissive licences only. LGPL appears in the tree only as one option of r-efi's
# "MIT OR Apache-2.0 OR LGPL-2.1-or-later", so it is not allowed here.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "0BSD", # stm32f4xx-hal (oasis-renode-m11): OSI-approved, more permissive than MIT
    "ISC",
    "Unicode-3.0",
    "Unlicense",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
